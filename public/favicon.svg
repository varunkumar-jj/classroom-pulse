<svg xmlns="http://www.w3.org/2000/svg" width="36" height="36" viewBox="0 0 36 36" role="img" aria-label="Classroom Pulse">
  <title>Classroom Pulse</title>
  <defs>
    <linearGradient id="cpLogo" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#5eead4"/>
      <stop offset="100%" stop-color="#7c9cff"/>
    </linearGradient>
  </defs>
  <rect width="36" height="36" rx="11" fill="url(#cpLogo)"/>
  <!-- A pulse trace: the moment a teacher realises the class is following. -->
  <path d="M7 18h4.2l2.1-6.4 3.4 12.8 2.6-8.1 1.9 3.4H29"
        fill="none" stroke="#08201c" stroke-width="2.4"
        stroke-linecap="round" stroke-linejoin="round"/>
</svg>
